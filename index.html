<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Indra · Ongoing Shipments</title>
    <!-- Favicon (inline SVG — cargo ship, matches the ocean/RGB theme) -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2064%2064'%3E%3Cdefs%3E%3ClinearGradient%20id='g'%20x1='0'%20y1='0'%20x2='1'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%2300f5ff'/%3E%3Cstop%20offset='.5'%20stop-color='%236b5cff'/%3E%3Cstop%20offset='1'%20stop-color='%23ff2bd6'/%3E%3C/linearGradient%3E%3ClinearGradient%20id='h'%20x1='0'%20y1='0'%20x2='0'%20y2='1'%3E%3Cstop%20offset='0'%20stop-color='%2300e5ff'/%3E%3Cstop%20offset='1'%20stop-color='%230b6fd6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect%20width='64'%20height='64'%20rx='15'%20fill='%2305142b'/%3E%3Ccircle%20cx='32'%20cy='30'%20r='22'%20fill='%2300e5ff'%20opacity='.10'/%3E%3Cpath%20d='M8%2040%20L56%2040%20L50%2052%20L14%2052%20Z'%20fill='url(%23h)'/%3E%3Crect%20x='44'%20y='30'%20width='10'%20height='8'%20rx='1'%20fill='%230d2f4f'%20stroke='url(%23g)'%20stroke-width='1'/%3E%3Crect%20x='48'%20y='24'%20width='4'%20height='6'%20rx='0.5'%20fill='%230d2f4f'%20stroke='url(%23g)'%20stroke-width='0.8'/%3E%3Crect%20x='14'%20y='36'%20width='6'%20height='4'%20rx='0.5'%20fill='%23ff4d6d'/%3E%3Crect%20x='22'%20y='36'%20width='6'%20height='4'%20rx='0.5'%20fill='%2300d4ff'/%3E%3Crect%20x='30'%20y='36'%20width='6'%20height='4'%20rx='0.5'%20fill='%23ffb703'/%3E%3Crect%20x='38'%20y='36'%20width='6'%20height='4'%20rx='0.5'%20fill='%23ff4d6d'/%3E%3Crect%20x='18'%20y='30'%20width='6'%20height='4'%20rx='0.5'%20fill='%2300d4ff'/%3E%3Crect%20x='26'%20y='30'%20width='6'%20height='4'%20rx='0.5'%20fill='%23ffb703'/%3E%3Crect%20x='34'%20y='30'%20width='6'%20height='4'%20rx='0.5'%20fill='%23ff4d6d'/%3E%3Cpath%20d='M6%2056c5-3.5%2011-3.5%2016%200s11%203.5%2016%200%2011-3.5%2016%200'%20fill='none'%20stroke='%2300f5ff'%20stroke-width='3'%20stroke-linecap='round'%20opacity='.55'/%3E%3C/svg%3E" />
    <!-- Inter font + Font Awesome icons -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* ----- RESET & BASE ----- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            background: #0b1120;
            overflow: hidden;
            position: relative;
        }

        /* ----- REALISTIC OCEAN + RGB AMBIENT BACKGROUND ----- */
        .ocean-bg {
            position: fixed;
            inset: 0;
            z-index: 0;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 72%, rgba(0, 229, 255, .18), transparent 34%),
                radial-gradient(circle at 15% 25%, rgba(255, 0, 153, .13), transparent 30%),
                radial-gradient(circle at 85% 18%, rgba(0, 102, 255, .18), transparent 32%),
                linear-gradient(180deg, #020617 0%, #061a35 42%, #03152b 100%);
        }

        /* Moving RGB light fields */
        .ocean-bg::before,
        .ocean-bg::after {
            content: "";
            position: absolute;
            inset: -25%;
            pointer-events: none;
            filter: blur(32px);
            opacity: .38;
            animation: rgbDrift 30s ease-in-out infinite alternate;
        }

        .ocean-bg::before {
            background:
                radial-gradient(circle at 20% 35%, rgba(255, 0, 128, .34), transparent 18%),
                radial-gradient(circle at 75% 30%, rgba(0, 120, 255, .38), transparent 20%),
                radial-gradient(circle at 55% 78%, rgba(0, 255, 220, .28), transparent 22%);
        }

        .ocean-bg::after {
            animation-duration: 38s;
            animation-direction: alternate-reverse;
            background:
                radial-gradient(circle at 80% 70%, rgba(170, 0, 255, .25), transparent 20%),
                radial-gradient(circle at 35% 70%, rgba(0, 255, 255, .22), transparent 20%);
        }

        /* Atmospheric horizon */
        .horizon {
            position: absolute;
            left: -10%;
            right: -10%;
            bottom: 25%;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(0, 255, 255, .55), rgba(255, 0, 170, .45), transparent);
            box-shadow: 0 0 30px rgba(0, 220, 255, .45);
            opacity: .7;
            filter: blur(.4px);
        }

        /* Fine realistic water texture */
        .water-texture {
            position: absolute;
            inset: 45% 0 0;
            opacity: .18;
            background:
                repeating-linear-gradient(
                    178deg,
                    transparent 0 7px,
                    rgba(255,255,255,.08) 8px,
                    transparent 10px 18px
                ),
                repeating-linear-gradient(
                    2deg,
                    transparent 0 13px,
                    rgba(0,220,255,.07) 14px,
                    transparent 16px 28px
                );
            transform: perspective(600px) rotateX(58deg) scale(1.35);
            transform-origin: bottom;
            animation: waterTexture 18s linear infinite;
        }

        /* Advanced SVG wave layers */
        .wave-layer {
            position: absolute;
            left: -5%;
            width: 110%;
            pointer-events: none;
            overflow: visible;
        }

        .wave-move {
            position: absolute;
            left: -10%;
            width: 120%;
            height: 100%;
        }

        .wave-move svg {
            display: block;
            width: 100%;
            height: 100%;
            overflow: visible;
        }

        .wave-deep {
            bottom: -2%;
            height: 52%;
            z-index: 1;
            opacity: .78;
        }

        .wave-deep .wave-move {
            animation: realisticWave 24s ease-in-out infinite alternate;
        }

        .wave-deep svg path {
            fill: url(#deepGradient);
            filter: drop-shadow(0 -6px 12px rgba(0, 90, 255, .12));
        }

        .wave-mid {
            bottom: -5%;
            height: 43%;
            z-index: 2;
            opacity: .82;
        }

        .wave-mid .wave-move {
            animation: realisticWave 18s ease-in-out infinite alternate-reverse;
        }

        .wave-mid svg path {
            fill: url(#midGradient);
            filter: drop-shadow(0 -5px 11px rgba(0, 220, 255, .14));
        }

        .wave-surface {
            bottom: -8%;
            height: 34%;
            z-index: 3;
        }

        .wave-surface .wave-move {
            animation: realisticWave 13s ease-in-out infinite alternate;
        }

        .wave-surface svg path {
            fill: url(#surfaceGradient);
            filter: drop-shadow(0 -4px 9px rgba(0, 255, 230, .16));
        }

        .wave-sparkle {
            bottom: -12%;
            height: 27%;
            z-index: 4;
            opacity: .72;
        }

        .wave-sparkle .wave-move {
            animation: realisticWave 9s ease-in-out infinite alternate-reverse;
        }

        .wave-sparkle svg path {
            fill: url(#sparkleGradient);
            filter: drop-shadow(0 0 6px rgba(255,255,255,.14));
        }

        /* Tiny reflective light streaks */
        .reflection {
            position: absolute;
            z-index: 5;
            width: 20%;
            height: 2px;
            border-radius: 50%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.9), rgba(0,255,255,.65), transparent);
            filter: blur(.3px);
            opacity: .45;
            animation: reflectionMove 10s ease-in-out infinite;
        }

        .reflection.r1 { left: 14%; bottom: 18%; animation-delay: -1s; }
        .reflection.r2 { left: 44%; bottom: 13%; width: 13%; animation-delay: -3s; }
        .reflection.r3 { right: 12%; bottom: 22%; width: 17%; animation-delay: -4.5s; }

        .glint {
            position: absolute;
            border-radius: 50%;
            pointer-events: none;
            z-index: 6;
            filter: blur(1px);
            animation: floatGlint 14s infinite alternate ease-in-out;
        }

        .glint-1 {
            width: 620px;
            height: 620px;
            background: radial-gradient(circle, rgba(0,255,255,.13) 0%, rgba(0,120,255,.05) 28%, transparent 70%);
            top: 8%;
            left: -15%;
        }

        .glint-2 {
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255,0,180,.10) 0%, rgba(100,0,255,.05) 32%, transparent 70%);
            top: 25%;
            right: -12%;
            animation-delay: 4s;
        }

        /* ----- CARGO SHIP (traveling forward, left to right) ----- */
        .ship-travel {
            position: absolute;
            z-index: 7;
            bottom: 24%;
            left: -20%; /* start off-screen left */
            width: min(300px, 36vw);
            pointer-events: none;
            animation: shipTravel 80s linear infinite;
        }

        .cargo-ship {
            width: 100%;
            opacity: 0.95;
            filter: drop-shadow(0 0 22px rgba(0, 220, 255, 0.3));
            animation: shipBob 7s ease-in-out infinite alternate;
            transform-origin: center bottom;
        }

        .cargo-ship svg {
            display: block;
            width: 100%;
            height: auto;
            overflow: visible;
            /* Flip the ship so the bow faces right — it now moves forward */
            transform: scaleX(-1);
        }

        @keyframes shipTravel {
            0%   { left: -20%; }
            100% { left: 120%; }
        }

        @keyframes shipBob {
            0%   { transform: translateY(0) rotate(-0.7deg); }
            50%  { transform: translateY(-10px) rotate(0.5deg); }
            100% { transform: translateY(3px) rotate(-0.4deg); }
        }

        /* Responsive adjustments */
        @media (max-width: 720px) {
            .ship-travel {
                width: 45vw;
                bottom: 22%;
            }
            .cargo-ship {
                opacity: 0.65;
            }
        }

        @media (max-width: 480px) {
            .ship-travel {
                display: none;
            }
        }

        /* ----- ANIMATIONS (background) ----- */
        @keyframes realisticWave {
            0% { transform: translate3d(-2%, 4px, 0) scaleY(.98); }
            50% { transform: translate3d(1%, -5px, 0) scaleY(1.02); }
            100% { transform: translate3d(3%, 3px, 0) scaleY(.99); }
        }

        @keyframes rgbDrift {
            0% { transform: translate3d(-3%, -2%, 0) scale(1); }
            50% { transform: translate3d(3%, 2%, 0) scale(1.08); }
            100% { transform: translate3d(-1%, 4%, 0) scale(1.04); }
        }

        @keyframes waterTexture {
            from { background-position: 0 0, 0 0; }
            to { background-position: 0 180px, 120px -120px; }
        }

        @keyframes reflectionMove {
            0%, 100% { transform: translateX(-25%) scaleX(.7); opacity: .15; }
            50% { transform: translateX(35%) scaleX(1.25); opacity: .72; }
        }

        @keyframes floatGlint {
            0% { transform: translate3d(0, 0, 0) scale(1); opacity: .25; }
            100% { transform: translate3d(55px, -35px, 0) scale(1.18); opacity: .65; }
        }

        /* ----- MAIN CARD ----- */
        .card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            background:
                linear-gradient(145deg, rgba(255,255,255,.105), rgba(255,255,255,.035)),
                rgba(2, 10, 28, .42);
            backdrop-filter: blur(14px) saturate(125%);
            -webkit-backdrop-filter: blur(14px) saturate(125%);
            border-radius: 2.5rem;
            padding: 2.8rem 2.2rem;
            border: 1px solid rgba(255,255,255,.13);
            box-shadow:
                0 28px 60px rgba(0,0,0,.52),
                inset 0 1px 0 rgba(255,255,255,.11),
                0 0 35px rgba(0,190,255,.055);
            transition: transform .35s ease, box-shadow .35s ease;
            transform: translateZ(0);
            overflow: hidden;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: -2px;
            border-radius: inherit;
            padding: 1px;
            background: linear-gradient(110deg, rgba(0,255,255,.55), transparent 30%, rgba(255,0,170,.35), transparent 70%, rgba(0,120,255,.45));
            -webkit-mask: linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            opacity: .65;
            pointer-events: none;
            animation: borderRGB 16s linear infinite;
        }

        @keyframes borderRGB {
            to { filter: hue-rotate(360deg); }
        }

        .card:hover {
            box-shadow: 0 50px 100px rgba(0, 0, 0, 0.7), inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }

        /* ----- DASHBOARD ----- */
        .dashboard {
            animation: fadeSlideIn 0.6s ease;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            margin-bottom: 0.2rem;
        }

        .brand i {
            font-size: 2.2rem;
            background: linear-gradient(135deg, #00f5ff, #6b5cff 48%, #ff2bd6);
            -webkit-background-clip: text;
            background-clip: text;
            color: transparent;
            filter: drop-shadow(0 0 10px rgba(0,220,255,.38));
            animation: iconRGB 5s linear infinite;
        }

        @keyframes iconRGB {
            to { filter: hue-rotate(360deg) drop-shadow(0 0 12px rgba(0,220,255,.42)); }
        }

        h1 {
            font-weight: 700;
            font-size: 1.1rem;
            color: #fff;
            letter-spacing: -0.02em;
        }

        .subhead {
            color: rgba(235,250,255,.68);
            font-size: .9rem;
            font-weight: 500;
            margin-bottom: 2rem;
            padding-left: .8rem;
            border-left: 3px solid #00eaff;
            text-shadow: 0 0 14px rgba(0,230,255,.25);
        }

        .divider {
            height: 1px;
            background: linear-gradient(to right, rgba(255, 255, 255, 0.08), transparent);
            margin: 1.2rem 0 1.8rem 0;
        }

        .link-grid {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .link-card {
            position: relative;
            overflow: hidden;
            background: linear-gradient(135deg, rgba(255,255,255,.075), rgba(255,255,255,.025));
            backdrop-filter: blur(8px) saturate(115%);
            -webkit-backdrop-filter: blur(8px) saturate(115%);
            padding: 1.2rem 1.5rem;
            border-radius: 1.55rem;
            border: 1px solid rgba(255,255,255,.095);
            display: flex;
            align-items: center;
            justify-content: space-between;
            text-decoration: none;
            color: #fff;
            transition: transform .35s cubic-bezier(.2,.8,.2,1), background .35s, border-color .35s, box-shadow .35s;
            cursor: pointer;
            transform: translateZ(0);
        }

        .link-card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(110deg, transparent 15%, rgba(0,255,255,.10) 45%, rgba(255,0,170,.08) 55%, transparent 80%);
            transform: translateX(-110%);
            transition: transform .65s ease;
        }

        .link-card:hover::before {
            transform: translateX(110%);
        }

        .link-card:hover {
            background: linear-gradient(135deg, rgba(0,220,255,.11), rgba(255,0,180,.065));
            border-color: rgba(0,230,255,.28);
            transform: translateX(7px) translateY(-2px) scale(1.012) translateZ(0);
            box-shadow: 0 16px 34px rgba(0,0,0,.35), 0 0 28px rgba(0,210,255,.09);
        }

        .link-left {
            display: flex;
            align-items: center;
            gap: 0.9rem;
        }

        .link-icon {
            width: 44px;
            height: 44px;
            border-radius: 1.2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.3rem;
            transition: 0.2s;
            transform: translateZ(0);
        }

        .link-card:hover .link-icon {
            transform: scale(1.05) translateZ(0);
        }

        .link-card:nth-child(1) .link-icon {
            background: rgba(255, 0, 0, 0.75);
            color: #FFFFFF;
            box-shadow: 0 0 20px rgba(255, 0, 0, 0.25);
        }

        .link-card:nth-child(2) .link-icon {
            background: rgba(255, 255, 255, 0.85);
            color: #FF0000;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.2);
        }

        .link-label {
            font-weight: 600;
            font-size: 1.05rem;
        }

        .link-sub {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.35);
            margin-top: 0.05rem;
        }

        .link-arrow {
            color: rgba(255, 255, 255, 0.2);
            font-size: 1.4rem;
            transition: 0.25s;
        }

        .link-card:hover .link-arrow {
            color: #7aa9ff;
            transform: translateX(6px) translateZ(0);
        }

        @keyframes fadeSlideIn {
            0% {
                opacity: 0;
                transform: translateY(25px) translateZ(0);
            }
            100% {
                opacity: 1;
                transform: translateY(0) translateZ(0);
            }
        }

        @media (max-width: 480px) {
            .card {
                padding: 2rem 1.5rem;
                border-radius: 2rem;
            }
            h1 {
                font-size: 1.4rem;
            }
            .brand i {
                font-size: 1.8rem;
            }
        }

        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after {
                animation-duration: .001ms !important;
                animation-iteration-count: 1 !important;
                scroll-behavior: auto !important;
            }
        }

        /* ----- PERFORMANCE OPTIMIZATION ----- */
        body.page-hidden .wave-move,
        body.page-hidden .ocean-bg::before,
        body.page-hidden .ocean-bg::after,
        body.page-hidden .water-texture,
        body.page-hidden .reflection,
        body.page-hidden .glint,
        body.page-hidden .ship-travel,
        body.page-hidden .cargo-ship {
            animation-play-state: paused !important;
        }

        @media (max-width: 700px) {
            .ocean-bg::before,
            .ocean-bg::after {
                filter: blur(22px);
                opacity: .28;
            }

            .water-texture {
                opacity: .10;
            }

            .reflection {
                opacity: .25;
            }

            .card {
                backdrop-filter: blur(10px) saturate(115%);
                -webkit-backdrop-filter: blur(10px) saturate(115%);
            }
        }

        @media (prefers-reduced-motion: reduce) {
            .ocean-bg::before,
            .ocean-bg::after,
            .wave-move,
            .water-texture,
            .reflection,
            .glint,
            .card::before,
            .ship-travel,
            .cargo-ship {
                animation: none !important;
            }
        }
    </style>
</head>
<body>

    <!-- VISIBLE OCEAN WAVES -->
    <div class="ocean-bg">
        <svg width="0" height="0" aria-hidden="true" style="position:absolute">
            <defs>
                <linearGradient id="deepGradient" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#071b3a"/>
                    <stop offset="48%" stop-color="#063b69"/>
                    <stop offset="100%" stop-color="#020d24"/>
                </linearGradient>
                <linearGradient id="midGradient" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#087caa" stop-opacity=".82"/>
                    <stop offset="42%" stop-color="#064d78" stop-opacity=".9"/>
                    <stop offset="100%" stop-color="#021d42"/>
                </linearGradient>
                <linearGradient id="surfaceGradient" x1="0" y1="0" x2="0" y2="1">
                    <stop offset="0%" stop-color="#13d9df" stop-opacity=".42"/>
                    <stop offset="28%" stop-color="#087da9" stop-opacity=".66"/>
                    <stop offset="100%" stop-color="#032d57" stop-opacity=".94"/>
                </linearGradient>
                <linearGradient id="sparkleGradient" x1="0" y1="0" x2="1" y2="1">
                    <stop offset="0%" stop-color="#b9ffff" stop-opacity=".18"/>
                    <stop offset="45%" stop-color="#ffffff" stop-opacity=".28"/>
                    <stop offset="75%" stop-color="#ff5cda" stop-opacity=".10"/>
                    <stop offset="100%" stop-color="#00eaff" stop-opacity=".18"/>
                </linearGradient>
            </defs>
        </svg>
        <div class="glint glint-1"></div>
        <div class="glint glint-2"></div>
        <div class="horizon"></div>
        <div class="water-texture"></div>
        <div class="reflection r1"></div>
        <div class="reflection r2"></div>
        <div class="reflection r3"></div>

        <!-- CARGO SHIP (traveling forward, left to right) -->
        <div class="ship-travel" aria-hidden="true">
            <div class="cargo-ship">
                <svg viewBox="0 0 240 110" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <linearGradient id="shipHull" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#0a2a4a"/>
                            <stop offset="100%" stop-color="#04121f"/>
                        </linearGradient>
                        <linearGradient id="shipAccent" x1="0" y1="0" x2="1" y2="0">
                            <stop offset="0%" stop-color="#00f5ff"/>
                            <stop offset="50%" stop-color="#6b5cff"/>
                            <stop offset="100%" stop-color="#ff2bd6"/>
                        </linearGradient>
                        <linearGradient id="container1" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#ff4d6d"/>
                            <stop offset="100%" stop-color="#b3002d"/>
                        </linearGradient>
                        <linearGradient id="container2" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#00d4ff"/>
                            <stop offset="100%" stop-color="#0066aa"/>
                        </linearGradient>
                        <linearGradient id="container3" x1="0" y1="0" x2="0" y2="1">
                            <stop offset="0%" stop-color="#ffb703"/>
                            <stop offset="100%" stop-color="#b36b00"/>
                        </linearGradient>
                    </defs>

                    <!-- Hull -->
                    <path d="M8,78 L18,92 L200,92 L222,78 L222,68 L8,68 Z"
                          fill="url(#shipHull)" stroke="url(#shipAccent)" stroke-width="1.6"/>
                    <!-- Deck line -->
                    <line x1="8" y1="68" x2="222" y2="68" stroke="url(#shipAccent)" stroke-width="1.2" opacity="0.7"/>

                    <!-- Superstructure -->
